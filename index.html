<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wutang</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <h1>Wutang</h1>
<!-- 5 inputs-->
  <label for="name">Name : </label>
  <input type="text" id="name" placeholder="What is your name?">

  <label for="color">Favorite Color : </label>
  <input type="color" id="color">

  <label for="date">Choose a Date : </label>
  <input type="date" id="date" >

  <label for="number">Favorite Number : </label>
  <input type="number"  id="number" placeholder="Your favorite number">

  <label for="character">Favorite Anime Character: </label>
  <input type="text" id="character" placeholder="Favorite anime character">

  <button id="submit" type="button">Submit</button>

  <script src="/js/main.js"></script>

</body>
</html>
